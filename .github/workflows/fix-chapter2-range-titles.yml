name: One-time fix Chapter 2 range titles

on:
  push:
    branches: [docs/audit-chapter2-results]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/audit-chapter2-results
          fetch-depth: 0

      - name: Replace range-style titles and strengthen check
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/guide/02-4-control-source.md'): (
                  'title: 2.4.1—2.4.3　建立控制文件：应用、控制路径与污染源',
                  'title: 2.4　建立控制文件：控制与污染源',
              ),
              Path('docs/guide/02-4-receptor-met-output.md'): (
                  'title: 2.4.4—2.4.6　受体、气象与输出路径',
                  'title: 2.4　建立控制文件：受体、气象与输出',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected title not found: {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          check = Path('scripts/check-chapter2.mjs')
          text = check.read_text(encoding='utf-8')
          old = """const index = texts['02-getting-started.md'] || ''
          for (const forbidden of ['2.2—2.3', '2.4.1—2.4.3', '2.4.4—2.4.6']) {
            if (index.includes(forbidden)) errors.push(`第2章导航仍使用区间式标题：${forbidden}`)
          }
          """
          new = """const index = texts['02-getting-started.md'] || ''
          for (const forbidden of ['2.2—2.3', '2.4.1—2.4.3', '2.4.4—2.4.6']) {
            if (combined.includes(forbidden)) errors.push(`第2章仍使用区间式标题：${forbidden}`)
          }
          """
          if old not in text:
              raise SystemExit('Expected Chapter 2 check block not found')
          check.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-chapter2-range-titles.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/guide/02-4-control-source.md docs/guide/02-4-receptor-met-output.md scripts/check-chapter2.mjs
          git commit -m "docs: remove remaining Chapter 2 range titles"
          git push origin HEAD:docs/audit-chapter2-results
